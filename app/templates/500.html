{% extends "base.html" %}
{% block title %}500 – Server Error{% endblock %}
{% block content %}
<div style="min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 24px;">
  <div>
    <div style="font-size:80px; margin-bottom:16px;">⚠️</div>
    <h1 style="font-family:var(--font-head); font-size:5rem; font-weight:900; color:var(--warning); line-height:1;">500</h1>
    <h2 style="font-family:var(--font-head); font-size:1.5rem; margin-bottom:12px;">Something Went Wrong</h2>
    <p style="color:var(--text-sec); max-width:400px; margin:0 auto 32px;">
      An unexpected error occurred. Our team has been notified. Please try again in a moment.
    </p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">← Go Home</a>
  </div>
</div>
{% endblock %}
